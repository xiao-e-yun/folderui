[project]
name = "folderui"
version = "0.2.0"
description = "Turn a folder into an immediate-mode GUI for humans and AI agents: *.md files are the view, *.sh files are buttons."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xiao-e-yun" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agent", "llm", "gui", "immediate-mode", "multiplayer", "turn-based"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/xiao-e-yun/folderui"
Repository = "https://github.com/xiao-e-yun/folderui"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "examples", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8"]
